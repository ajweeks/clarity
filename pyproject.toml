[project]
name = "clarity"
version = "0.1.0"
description = "A simple AI-powered text correction tool."
authors = [{ name = "ajweeks", email = "contact@ajweeks.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = "WTFPL"
dependencies = [
    "openai>=3.36.1,<4",
    "anthropic>=2.1.0,<3",
    "fastapi>=0.159.1,<0.160",
    "uvicorn>=0.54.0,<0.55",
    "tiktoken>=0.14.0,<0.15",
    "python-dotenv>=1.2.4",
    "httpx>=0.28.1",
]

[project.scripts]
clarity = "clarity.api:serve"
clarity-api = "clarity.api:serve"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0,<8",
    "pre-commit>=4.7.0,<5",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["clarity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
